<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinBot - AI Auditor Keuangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
    #chat-container { height: 100vh; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; background: white; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    #chat-output { flex-grow: 1; overflow-y: auto; padding: 1.5rem; }
    .message-bubble { padding: 1rem; border-radius: 1rem; max-width: 85%; line-height: 1.5; }
    .user-message { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    .user-message .message-bubble { background-color: #1e3a8a; color: white; border-bottom-right-radius: 0; }
    .bot-message { display: flex; justify-content: flex-start; margin-bottom: 1rem; }
    .bot-message .message-bubble { background-color: #e5e7eb; color: #1f2937; border-bottom-left-radius: 0; }
    .loading-dots span { display: inline-block; width: 6px; height: 6px; background: #1f2937; border-radius: 50%; animation: blink 1.4s infinite; margin: 0 2px; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="chat-container">
    <header class="bg-blue-900 text-white p-4 flex items-center shadow-md">
      <i class="fa-solid fa-chart-line text-2xl mr-3"></i>
      <div>
        <h1 class="text-xl font-bold">FinBot AI</h1>
        <p class="text-xs text-blue-200">Asisten Audit Fundamental Saham</p>
      </div>
    </header>
    
    <div id="chat-output">
      <div class="bot-message">
        <div class="message-bubble">
          Halo! Saya FinBot. Sebutkan kode saham perusahaan (contoh: GOTO.JK atau BBCA.JK) dan saya akan mengaudit kesehatan utang dan kas mereka secara real-time.
        </div>
      </div>
    </div>

    <div class="p-4 bg-white border-t">
      <form id="message-form" class="flex items-center bg-gray-100 rounded-full p-2">
        <input type="text" id="user-input" class="flex-grow bg-transparent px-4 outline-none" placeholder="Cek utang Telkom (TLKM.JK)..." autocomplete="off" />
        <button type="submit" id="submit-btn" class="bg-blue-900 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-800 transition">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Generate User ID unik untuk sesi ini
    const userId = "user_" + Math.random().toString(36).substr(2, 9);

    $(document).ready(function() {
      const $chatOutput = $("#chat-output");
      const $userInput = $("#user-input");
      const $form = $("#message-form");

      function scrollToBottom() {
        $chatOutput.scrollTop($chatOutput[0].scrollHeight);
      }

      $form.submit(function(e) {
        e.preventDefault();
        const msg = $userInput.val().trim();
        if (!msg) return;

        // Tampilkan pesan user
        $chatOutput.append(`<div class="user-message"><div class="message-bubble">${msg}</div></div>`);
        $userInput.val("");
        scrollToBottom();

        // Tampilkan loading
        const loadingId = "load_" + Date.now();
        $chatOutput.append(`
          <div class="bot-message" id="${loadingId}">
            <div class="message-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>
          </div>
        `);
        scrollToBottom();

        // AJAX Call ke Python Backend
        $.ajax({
          type: "POST",
          // =================================================================
          // UBAH URL DI BAWAH INI DENGAN URL CLOUD RUN ANDA
          // =================================================================
          url: "https://finbot-backend-367625469919.us-central1.run.app/chat", 
          contentType: "application/json",
          data: JSON.stringify({ user_id: userId, message: msg }),
          success: function(res) {
            $(`#${loadingId}`).remove();
            const formattedText = res.response.replace(/\n/g, "<br>");
            $chatOutput.append(`<div class="bot-message"><div class="message-bubble">${formattedText}</div></div>`);
            scrollToBottom();
          },
          error: function() {
            $(`#${loadingId}`).remove();
            $chatOutput.append(`<div class="bot-message"><div class="message-bubble text-red-600">Maaf, server sedang sibuk atau URL API salah.</div></div>`);
            scrollToBottom();
          }
        });
      });
    });
  </script>
</body>
</html>
